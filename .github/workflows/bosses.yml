name: Atualizar bosses

# O agendamento do GitHub pula muitas rodadas (com "a cada 10 min" ele chegou a
# rodar 1 vez em 14 horas). Por isso cada rodada fica ligada ~5h45, lendo o feed
# a cada 3 minutos. O agendamento de hora em hora só serve pra deixar a próxima
# rodada na fila: quando a atual termina, a da fila começa na hora.

on:
  schedule:
    - cron: '17 * * * *'      # de hora em hora (minuto 17 pra fugir do horário de pico)
  workflow_dispatch:          # botão "Run workflow" pra rodar na hora

permissions:
  contents: write

concurrency:
  group: bosses
  cancel-in-progress: false   # nunca derruba a rodada que está lendo; a nova espera na fila

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ler o feed do DFProfiler a cada 3 minutos (~5h45)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + 345 * 60))
          while [ $SECONDS -lt $end ]; do
            # Pega mudanças feitas fora do robô (ex.: correção à mão) antes de ler o feed
            git pull -q --rebase || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; }
            node update.js || echo "falha ao ler o feed, tentando de novo na próxima volta"
            git add bosses.json
            if ! git diff --cached --quiet; then
              git commit -q -m "bosses $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull -q --rebase || git rebase --abort
              git push -q || echo "push falhou, tenta de novo na próxima volta"
            fi
            sleep 180
          done
